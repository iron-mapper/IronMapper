name: CI

# Push runs only on main (after a merge); every other branch is checked through its pull request, so a branch with
# an open PR is not built twice. All jobs run on both events (no job-level conditions).
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: >
          dotnet test --no-build -c Release
          --logger "trx;LogFileName=results.trx"
          --collect:"XPlat Code Coverage"
          -- xunit.parallelizeTestCollections=true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        shell: bash
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator \
            "-reports:**/coverage.cobertura.xml" \
            "-targetdir:coverage-report" \
            "-reporttypes:Html;Cobertura"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.os }}
          path: coverage-report/

  package:
    name: Pack & verify NuGet package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Packs IronMapper + IronMapper.Extensions.DI, checks the .nupkg layout
      # (lib/ + analyzers/dotnet/cs, no Microsoft.CodeAnalysis dependency) and builds
      # tests/IronMapper.PackageConsumer from the local feed. Fails if the generator does not run.
      - name: Pack & verify
        shell: pwsh
        run: ./eng/verify-package.ps1 -PackageDir ./artifacts/packages

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/

  aot:
    # NativeAOT probes against the packed packages (eng/verify-aot.ps1), net8.0 and net10.0: the generated extension
    # methods (tests/IronMapper.AotProbe) publish with PublishAot without trim/AOT warnings and the executable checks
    # the mapped values; IMapper (tests/IronMapper.AotProbe.DI) must report IL2026 on the AddIronMapper call and
    # nothing else.
    name: NativeAOT probes (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: NativeAOT prerequisites
        shell: bash
        run: |
          missing=""
          command -v clang >/dev/null || missing="$missing clang"
          dpkg -s zlib1g-dev >/dev/null 2>&1 || missing="$missing zlib1g-dev"
          if [ -n "$missing" ]; then sudo apt-get update && sudo apt-get install -y $missing; fi

      - name: NativeAOT probes
        shell: pwsh
        run: ./eng/verify-aot.ps1 -PackageDir ./artifacts/packages

  benchmarks:
    # Smoke check of the comparison suite in benchmarks/ against the local sources: it builds, the equivalence
    # tests pass, and every runtime scenario runs one iteration (BenchmarkDotNet Dry job) on .NET 10 and .NET 8.
    # No numbers are published: results come only from a full run (benchmarks/scripts/run-all.ps1).
    # StartupBenchmark (20 cold-start processes) is left to run-startup.ps1.
    name: Benchmarks smoke (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        working-directory: benchmarks
        run: dotnet build IronMapper.Comparison.slnx -c Release -p:UseLocalIronMapper=true

      - name: Equivalence tests (net10.0, net8.0)
        working-directory: benchmarks
        run: dotnet test IronMapper.Comparison.slnx -c Release --no-build -p:UseLocalIronMapper=true

      - name: One iteration of every scenario
        working-directory: benchmarks
        shell: bash
        env:
          UseLocalIronMapper: 'true'
        run: |
          for tf in net10.0 net8.0; do
            echo "::group::$tf"
            dotnet run -c Release -f "$tf" --project src/Comparison.Benchmarks --no-build -p:UseLocalIronMapper=true -- \
              --filter '*.FlatBenchmark.*' '*.NestedBenchmark.*' '*.CollectionBenchmark.*' \
                       '*.CustomConfigBenchmark.*' '*.InPlaceBenchmark.*' '*.DiOverheadBenchmark.*' \
              --job Dry --join --artifacts "$RUNNER_TEMP/bdn-smoke-$tf"
            echo "::endgroup::"
          done
