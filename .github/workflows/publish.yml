name: Publish NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Pack & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore -c Release

      - name: Test (Release)
        run: dotnet test --no-build -c Release

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Check tag matches project version
        run: |
          PROJECT_VERSION=$(dotnet msbuild src/IronMapper/IronMapper.csproj -getProperty:Version)
          if [ "$PROJECT_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match <Version>$PROJECT_VERSION</Version> in Directory.Build.props"
            exit 1
          fi

      # Packs IronMapper + IronMapper.Extensions.DI into ./nupkgs and verifies them
      # (package layout + consumer project built from the local feed) before anything is pushed.
      - name: Pack & verify
        shell: pwsh
        run: ./eng/verify-package.ps1 -Version ${{ steps.version.outputs.VERSION }} -PackageDir ./nupkgs

      - name: Push to NuGet.org
        run: >
          dotnet nuget push ./nupkgs/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Push symbols (.snupkg)
        run: >
          dotnet nuget push ./nupkgs/*.snupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
